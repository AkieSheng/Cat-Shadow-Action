<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>猫影行动｜门禁卡与保险箱点位</title>
<style>


:root {
  --bg: #f4f4f4;
  --panel: #ffffff;
  --line: #000000;
  --hidden: #dcefff;
  --door: #8a8a8a;
  --red: #e60000;
  --green: #00b520;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #111;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
h1 { margin: 0 0 10px; font-size: 28px; }
h2 { margin: 0 0 6px; font-size: 20px; }
p { margin: 6px 0; line-height: 1.7; }
.note, .legend {
  background: var(--panel);
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px 16px;
  margin: 14px 0 20px;
}
.legend span { display: inline-flex; align-items: center; gap: 8px; margin-right: 18px; margin-bottom: 8px; white-space: nowrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.dot.red { background: var(--red); }
.dot.green { background: var(--green); }
.box.blue { width: 18px; height: 14px; background: var(--hidden); border: 1px solid #aaa; display: inline-block; }
.line-sample { width: 28px; height: 0; border-top: 5px solid var(--line); display: inline-block; }
.door-sample { width: 28px; height: 0; border-top: 5px solid var(--door); display: inline-block; }
.map-card {
  background: var(--panel);
  border: 1px solid #d9d9d9;
  border-radius: 18px;
  padding: 16px;
  margin: 22px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
}
.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}
.tag {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #eeeeee;
  font-size: 12px;
  font-weight: 600;
}
.svg-wrap {
  width: 100%;
  overflow: auto;
  border: 1px solid #e6e6e6;
  border-radius: 14px;
  background: white;
}
.maze-svg {
  display: block;
  width: min(100%, 980px);
  height: auto;
  margin: 0 auto;
  background: white;
}
.meta {
  font-size: 13px;
  color: #444;
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 12px;
}
code { background:#f0f0f0; padding: 1px 5px; border-radius: 4px; }



.spawn-note {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 12px 16px;
  margin: 12px 0 20px;
}
.letter-sample {
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 800;
  font-size: 18px;
  display: inline-block;
  min-width: 18px;
  text-align: center;
}
.letter-c { color: #0057d9; }
.letter-b { color: #111111; }

</style>
</head>
<body>
<main>
<h1>《猫影行动》门禁卡与保险箱点位</h1>
<div class="legend">
<span><i class="line-sample"></i>黑色线：墙体/边界</span>
<span><i class="box blue"></i>浅蓝：隐藏区 / 门禁特殊区</span>
<span><i class="door-sample"></i>灰色线：隐藏区房门</span>
<span><i class="dot green"></i>绿色点：入口</span>
<span><i class="dot red"></i>红色点：撤离点</span>
<span><i class="letter-sample letter-c">C</i>门禁卡点位（贴墙）</span>
<span><i class="letter-sample letter-b">B</i>保险箱点位（格子内下角标）</span>
</div>
